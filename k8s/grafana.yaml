# k8s/grafana.yaml — Grafana в кластере
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  labels:
    app: grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: "default"
        folder: ""
        type: file
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-horizon
  labels:
    app: grafana
data:
  horizon.json: |
    {
      "title": "Horizon Detection API",
      "uid": "horizon-detection",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Запросов в секунду",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "rate(horizon_requests_total[1m])", "legendFormat": "{{endpoint}} {{status}}" }
          ]
        },
        {
          "id": 2,
          "title": "Время обработки (p95), секунды",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.95, rate(horizon_request_duration_seconds_bucket[5m]))", "legendFormat": "p95 {{endpoint}}" }
          ]
        },
        {
          "id": 3,
          "title": "Roll (крен), градусы",
          "type": "gauge",
          "gridPos": { "x": 0, "y": 8, "w": 6, "h": 8 },
          "options": { "minVizHeight": 75, "minVizWidth": 75, "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "min": -90, "max": 90,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 15 },
                { "color": "red", "value": 30 }
              ] }
            }
          },
          "targets": [ { "expr": "horizon_roll_degrees", "legendFormat": "roll" } ]
        },
        {
          "id": 4,
          "title": "Pitch (тангаж), градусы",
          "type": "gauge",
          "gridPos": { "x": 6, "y": 8, "w": 6, "h": 8 },
          "options": { "minVizHeight": 75, "minVizWidth": 75, "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "min": -90, "max": 90,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 15 },
                { "color": "red", "value": 30 }
              ] }
            }
          },
          "targets": [ { "expr": "horizon_pitch_degrees", "legendFormat": "pitch" } ]
        },
        {
          "id": 5,
          "title": "Горизонт обнаружен / не обнаружен",
          "type": "piechart",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            { "expr": "horizon_detected_total", "legendFormat": "detected={{detected}}" }
          ]
        },
        {
          "id": 6,
          "title": "Размер входных изображений (байты)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "targets": [
            { "expr": "histogram_quantile(0.50, rate(horizon_image_size_bytes_bucket[5m]))", "legendFormat": "медиана" },
            { "expr": "histogram_quantile(0.95, rate(horizon_image_size_bytes_bucket[5m]))", "legendFormat": "p95" }
          ]
        },
        {
          "id": 7,
          "title": "Ошибки (4xx / 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "targets": [
            { "expr": "rate(horizon_requests_total{status!=\"200\"}[1m])", "legendFormat": "{{endpoint}} {{status}}" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-horizon
              mountPath: /etc/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-horizon
          configMap:
            name: grafana-dashboard-horizon
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
